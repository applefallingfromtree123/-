<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>STICK // 1000</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&display=swap');
    :root{--ink:#f7f3eb;--muted:#aaa69e;--paper:#f2eee4;--night:#101010;--acid:#d8ff2d;--red:#ff5c5c}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#151515;color:var(--ink);font-family:Manrope,"Apple SD Gothic Neo",sans-serif}
    body:before{content:"";position:fixed;inset:0;opacity:.15;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%)}
    button{font:inherit;color:inherit;cursor:pointer;border:0}.app{max-width:1240px;margin:auto;min-height:100vh;padding:24px 26px 35px;position:relative}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3d3d3d;padding-bottom:20px}.logo{font-family:"Black Han Sans",sans-serif;font-size:clamp(27px,4vw,50px);letter-spacing:-2px;line-height:.85}.logo i{font:400 12px "DM Mono";letter-spacing:2px;color:var(--acid);display:block;margin:10px 0 0 3px}.limit{font:500 12px "DM Mono";letter-spacing:1px;text-align:right;color:var(--muted)}.limit b{display:block;color:var(--ink);font-size:23px;letter-spacing:-1px;margin-top:4px}
    main{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding-top:28px}.stage{min-height:620px;border:1px solid #414141;background:radial-gradient(circle at 50% 44%,#343434 0,#1c1c1c 35%,#111 75%);position:relative;overflow:hidden;display:grid;place-items:center}.stage:before{content:"DRAW A STICKMAN";position:absolute;top:20px;left:22px;color:#777;font:12px "DM Mono";letter-spacing:2px}.stage:after{content:"1000 TYPES / 1 THE ONE";position:absolute;bottom:20px;right:22px;color:#777;font:11px "DM Mono";letter-spacing:1px}
    .card-wrap{width:min(73vw,310px);aspect-ratio: .66;perspective:1000px;position:relative}.card{height:100%;position:relative;padding:18px;background:var(--paper);color:#161616;border:2px solid #faf7ee;box-shadow:12px 15px 0 #070707;overflow:hidden;transform:rotate(-2deg);transition:transform .3s ease,filter .3s}.card.empty{display:grid;place-items:center;background:#202020;color:#777;border-color:#5b5b5b;box-shadow:10px 12px 0 #080808}.card.empty .front{display:none}.card.pop{animation:cardPop .65s cubic-bezier(.1,.8,.2,1)}@keyframes cardPop{0%{transform:scale(.6) rotate(10deg);opacity:0}60%{transform:scale(1.08) rotate(-4deg)}100%{transform:scale(1) rotate(-2deg)}}
    .card-top,.card-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;font:500 10px "DM Mono";letter-spacing:1px}.rarity{font-weight:bold}.serial{color:#555}.art{height:72%;display:grid;place-items:center;position:relative}.art svg{width:93%;height:100%;filter:drop-shadow(5px 7px 0 rgba(0,0,0,.16))}.card-name{position:absolute;bottom:28px;left:18px;z-index:2;font-family:"Black Han Sans";font-size:clamp(23px,3.4vw,34px);letter-spacing:-1px;line-height:1.04}.card-desc{position:absolute;bottom:16px;left:19px;font-size:9px;color:#4d4d4d}.empty-mark{font:500 18px "DM Mono";letter-spacing:4px;writing-mode:vertical-rl}
    .shine{position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.72) 49%,transparent 56%);transform:translateX(-65%) rotate(15deg);pointer-events:none}.card.effect .shine{animation:shine 2.4s linear infinite}@keyframes shine{to{transform:translateX(65%) rotate(15deg)}}
    .controls{text-align:center;margin-top:35px;position:relative;z-index:2}.draw{background:var(--acid);color:#111;padding:17px 38px;font-weight:800;letter-spacing:.5px;box-shadow:6px 6px 0 #000;transition:.15s}.draw:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #000}.draw:disabled{cursor:not-allowed;background:#5d5d5d;color:#aaa;box-shadow:4px 4px #050505}.draw small{font:500 10px "DM Mono";display:block;letter-spacing:1px;margin-top:3px}.reset{margin-top:19px;background:transparent;color:#888;text-decoration:underline;font-size:11px}
    .info{border:1px solid #414141;background:#191919;padding:25px;display:flex;flex-direction:column}.info h2{font-family:"Black Han Sans";font-size:31px;letter-spacing:-1px;margin:0 0 8px}.info p{color:#aaa;font-size:14px;line-height:1.8;margin:0 0 22px}.info .detail{border-top:1px solid #3b3b3b;padding-top:19px;font:12px "DM Mono";line-height:2;color:#bdb9b1}.detail strong{color:var(--acid)}.rarity-list{margin-top:auto}.rarity-list h3{font:500 10px "DM Mono";letter-spacing:2px;color:#888;margin:25px 0 11px}.rrow{display:grid;grid-template-columns:17px 1fr auto;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid #292929}.dot{height:9px;width:9px;border-radius:50%;background:var(--c)}.rate{font:11px "DM Mono";color:#929292}
    #flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle,var(--fx,#fff),transparent 60%)}body.fx #flash{animation:flash .7s ease-out}@keyframes flash{0%{opacity:.8}100%{opacity:0}}#particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;width:7px;height:7px;background:var(--p);left:50%;top:50%;animation:burst .8s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(420deg);opacity:0}}
    .effect-title{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) scale(.7);font:900 clamp(31px,6vw,65px)/.9 "Black Han Sans";text-align:center;letter-spacing:-2px;opacity:0;pointer-events:none;text-shadow:3px 3px #000;white-space:nowrap}.effect-title.show{animation:title .95s cubic-bezier(.1,.8,.2,1)}@keyframes title{15%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1.15)}}
    .collection{grid-column:1/-1;border-top:1px solid #414141;padding-top:20px}.collection-head{display:flex;justify-content:space-between;align-items:end}.collection h2{font:800 17px "DM Mono";letter-spacing:1px;margin:0}.collection span{font:11px "DM Mono";color:#888}.shelf{display:flex;gap:10px;margin-top:15px;overflow-x:auto;padding-bottom:8px}.mini{width:75px;flex:none;aspect-ratio:.66;padding:5px;background:var(--mc);color:#111;position:relative;border:1px solid #eee}.mini svg{width:100%;height:78%}.mini b{position:absolute;bottom:5px;left:5px;font-size:7px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:760px){.app{padding:17px 14px 28px}main{grid-template-columns:1fr}.stage{min-height:500px}.info{min-height:0}.rarity-list{margin-top:10px}.rarity-list .rrow:nth-child(n+8){display:none}.card-wrap{width:min(65vw,260px)}header{padding-bottom:15px}}
  </style>
</head>
<body><div id="flash"></div><div id="particles"></div><div class="app">
  <header><div class="logo">스틱 1000<i>STICKMAN CARD ARCHIVE</i></div><div class="limit">TODAY'S DRAWS<b><span id="left">10</span> / 10</b></div></header>
  <main><section><div class="stage"><div class="effect-title" id="effectTitle"></div><div class="card-wrap"><article id="card" class="card empty"><div class="empty-mark">READY?</div></article></div></div><div class="controls"><button id="draw" class="draw">카드 뽑기 <small>DRAW 01</small></button><br><button class="reset" id="reset">저장된 컬렉션 초기화</button></div></section>
  <aside class="info"><div><h2 id="infoTitle">첫 번째 스틱맨을<br>만나보세요.</h2><p id="infoDesc">하루에 열 번, 1,000종의 스틱맨 카드 중 하나를 뽑을 수 있습니다. 최고 등급 <b>THE ONE</b>은 단 하나뿐입니다.</p><div class="detail" id="detail"><strong>TIP</strong><br>자정이 지나면 뽑기 횟수가 다시 충전됩니다.<br>모든 카드는 브라우저에 안전하게 저장됩니다.</div></div><div class="rarity-list" id="rarities"></div></aside>
  <section class="collection"><div class="collection-head"><h2>MY ARCHIVE</h2><span id="count">0 / 1000 FOUND</span></div><div id="shelf" class="shelf"></div></section></main>
</div>
<script>
(() => {
  const RARITIES=[
    ['커먼','COMMON','#b7b3aa',330,false],['언커먼','UNCOMMON','#77bd79',250,false],['레어','RARE','#5da8f2',180,false],['더블레어','DOUBLE RARE','#a576ee',120,false],
    ['슈퍼레어','SUPER RARE','#ff75b7',60,true],['하이퍼레어','HYPER RARE','#ff8b43',30,true],['울트라레어','ULTRA RARE','#ffe15b',16,true],['레전드','LEGEND','#ff5364',8,true],['goat','GOAT','#e8eeff',3,true],['champion','CHAMPION','#42f5ce',1,true],['one','ONE','#fd72ff',1,true],['the one','THE ONE','#ffffff',1,true]
  ];
  const NAMES=['점프왕','달빛 닌자','용암 발차기','비밀 요원','젤리 펀치','우주 러너','박스 헤드','번개 댄서','꼬마 마법사','바나나 헌터','폭풍 검객','네온 스케이터','고글 탐험가','구름 도둑','라면 마스터','별빛 기사','디스코 히어로','캡틴 문워크','로봇 마임','스프린트 제왕'];
  const TRAITS=['오늘도 중력과 협상 중이다.','무릎으로 모든 문제를 해결한다.','검은 선 하나로 전설이 되었다.','절대 넘어지지 않는다. 아마도.','주머니에는 비밀 간식이 있다.','바람이 불면 더 빨라진다.','춤추듯 위험을 피한다.','자신의 그림자와 라이벌이다.'];
  const KEY='stick-1000-v1',date=()=>new Date().toLocaleDateString('en-CA');
  let state; try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){} state ||= {day:date(),draws:0,found:[]}; if(state.day!==date())state={...state,day:date(),draws:0};
  const $=s=>document.querySelector(s), save=()=>localStorage.setItem(KEY,JSON.stringify(state));
  function typeOf(id){const limits=[330,580,760,880,940,970,986,994,997,998,999];return limits.findIndex(limit=>id<=limit);}
  function makeCard(id){const ri=id===1000?11:typeOf(id), r=RARITIES[ri], n=NAMES[(id*7+ri*3)%NAMES.length], trait=TRAITS[(id*11)%TRAITS.length]; return {id,ri,r,n,trait,seed:id*31};}
  function stick(c){const a=c.seed%360, hat=c.seed%5, color=['#202020','#354c73','#cf463f','#4c8a69','#774fa1'][c.seed%5], accent=['#ffdb3b','#62dbff','#fc799c','#c2fa44'][c.seed%4]; const pose=c.seed%4; let arms=pose===0?'M75 130 L42 155 M76 130 L109 103':pose===1?'M75 130 L42 110 M76 130 L108 114':pose===2?'M75 130 L42 143 M76 130 L111 143':'M75 130 L48 128 M76 130 L105 128'; let legs=pose===1?'M75 175 L55 205 M75 175 L100 190':pose===2?'M75 175 L45 188 M75 175 L104 202':'M75 175 L57 207 M75 175 L96 207'; return `<svg viewBox="0 0 150 230" aria-label="${c.n} 스틱맨"><circle cx="75" cy="81" r="29" fill="${color}" stroke="#111" stroke-width="5"/><path d="M60 70 Q75 56 91 71" stroke="${accent}" stroke-width="6" fill="none"/><circle cx="65" cy="82" r="3"/><circle cx="85" cy="82" r="3"/><path d="M65 96 Q75 103 85 96" stroke="#111" stroke-width="3" fill="none"/><path d="M75 110 L75 176 M${arms.slice(1)} M${legs.slice(1)}" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 119 L98 119 L91 166 L59 166Z" fill="${color}" stroke="#111" stroke-width="5"/><path d="M62 138 L88 138" stroke="${accent}" stroke-width="5"/>${hat===0?`<path d="M45 63 Q75 29 106 63Z" fill="${accent}" stroke="#111" stroke-width="5"/>`:hat===1?`<rect x="47" y="49" width="57" height="13" rx="6" fill="${accent}" stroke="#111" stroke-width="4"/>`:''}<text x="75" y="222" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">TYPE ${String(c.id).padStart(4,'0')}</text></svg>`;}
  function renderCard(c){const effect=c.r[5]; $('#card').className='card '+(effect?'effect':'')+' pop'; $('#card').style.background=`linear-gradient(135deg,${c.r[2]}33, #f4f0e5 42%)`; $('#card').innerHTML=`<div class="front"><div class="card-top"><span class="rarity" style="color:${c.r[2]}">${c.r[1]}</span><span class="serial">#${String(c.id).padStart(4,'0')}</span></div><div class="art">${stick(c)}</div><div class="card-name">${c.n}</div><div class="card-desc">${c.trait}</div>${effect?'<div class="shine"></div>':''}</div>`; setTimeout(()=>$('#card').classList.remove('pop'),800); $('#infoTitle').textContent=c.n; $('#infoDesc').textContent=c.trait; $('#detail').innerHTML=`<strong style="color:${c.r[2]}">${c.r[0].toUpperCase()}</strong><br>카드 번호 #${String(c.id).padStart(4,'0')} · 스틱맨 도감에 등록됨<br>희귀도 순위 ${c.ri+1} / ${RARITIES.length}`;}
  function draw(){if(state.draws>=10)return; let id;if(!state.found.includes(1000)&&Math.random()<.002)id=1000;else id=1+Math.floor(Math.random()*999);const c=makeCard(id);state.draws++;if(!state.found.includes(id))state.found.unshift(id);save();renderCard(c);if(c.r[5])effect(c);render();}
  function effect(c){document.documentElement.style.setProperty('--fx',c.r[2]);document.body.classList.remove('fx');void document.body.offsetWidth;document.body.classList.add('fx');const t=$('#effectTitle');t.style.color=c.r[2];t.innerHTML=`${c.r[1]}<br><small style="font:14px DM Mono;letter-spacing:4px">EFFECT ON</small>`;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');const p=$('#particles');for(let i=0;i<32;i++){let e=document.createElement('i');e.className='particle';e.style.setProperty('--p',c.r[2]);e.style.setProperty('--x',`${(Math.random()-.5)*100}vw`);e.style.setProperty('--y',`${(Math.random()-.5)*100}vh`);p.append(e);setTimeout(()=>e.remove(),850)}}
  function render(){const left=10-state.draws;$('#left').textContent=left;$('#draw').disabled=left<=0;$('#draw').innerHTML=left<=0?'오늘의 뽑기를 모두 사용했어요 <small>COME BACK TOMORROW</small>':`카드 뽑기 <small>DRAW ${String(state.draws+1).padStart(2,'0')}</small>`;$('#count').textContent=`${state.found.length} / 1000 FOUND`;$('#shelf').innerHTML=state.found.slice(0,24).map(id=>{let c=makeCard(id);return `<div class="mini" style="--mc:${c.r[2]}">${stick(c)}<b>${c.n}</b></div>`}).join('')||'<span style="color:#777;font:12px DM Mono">아직 카드가 없습니다.</span>';}
  $('#rarities').innerHTML='<h3>RARITY INDEX · RIGHT IS RARER</h3>'+RARITIES.map((r,i)=>`<div class="rrow"><i class="dot" style="--c:${r[2]}"></i><span>${r[0]} ${r[5]?'✦':''}</span><span class="rate">${i===11?'ONLY 1':'RATE '+r[3]+'‰'}</span></div>`).join('');
  $('#draw').onclick=draw;$('#reset').onclick=()=>{if(confirm('정말 컬렉션을 초기화할까요?')){state={day:date(),draws:0,found:[]};save();location.reload()}};render();
})();
</script></body></html>
